<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Trading City — Demo</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#080e1c;color:#e8f2ff;font:14px system-ui}canvas{display:block}#panel{position:absolute;top:16px;left:16px;background:#101c32e8;border:1px solid #344b69;border-radius:14px;padding:16px;min-width:220px;box-shadow:0 10px 40px #0009}h1{font-size:18px;margin:0 0 6px}.tag{color:#64e4af;font-weight:700}#rows{margin-top:12px}.item{display:flex;justify-content:space-between;gap:22px;margin:8px 0}small{color:#a5bbd4}button{border:1px solid #58a7f3;background:#173759;color:#fff;border-radius:7px;padding:9px;margin-top:12px;cursor:pointer}#notice{position:absolute;bottom:12px;left:16px;color:#bacde0;font-size:12px;max-width:90%}</style></head>
<body><div id="panel"><h1>AI Trading City</h1><small class="tag">SIMULATION ONLY · $0 SETUP</small><div id="rows"></div><button id="toggle">Pause simulation</button><p><small>Drag to rotate · Scroll to zoom</small></p></div><div id="notice">Prices are randomly simulated. No real orders, brokerage connection, or real money.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const tickers=['SPY','QQQ','NVDA','AMD','TSLA','AAPL']; const prices=[560,480,170,145,245,235];let paused=false;
const scene=new THREE.Scene();scene.background=new THREE.Color('#080e1c');scene.fog=new THREE.Fog('#080e1c',18,45);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);camera.position.set(12,13,17);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x7396c7,1.5));const light=new THREE.DirectionalLight(0x8ae5ff,2.5);light.position.set(5,13,8);scene.add(light);
const base=new THREE.Mesh(new THREE.BoxGeometry(18,.4,12),new THREE.MeshStandardMaterial({color:0x13233c}));base.position.y=-.3;scene.add(base);
const grid=new THREE.GridHelper(18,18,0x244662,0x244662);grid.position.y=-.08;scene.add(grid);
function label(text){const c=document.createElement('canvas');c.width=256;c.height=80;const ctx=c.getContext('2d');ctx.fillStyle='#e8f4ff';ctx.font='bold 42px sans-serif';ctx.textAlign='center';ctx.fillText(text,128,53);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));sprite.scale.set(2,.65,1);return sprite}
const objects=[];tickers.forEach((symbol,i)=>{const x=(i%3-1)*5,z=(Math.floor(i/3)-.5)*6;const h=2.5+i*.42;const mat=new THREE.MeshStandardMaterial({color:0x20c997,metalness:.28,roughness:.45,emissive:0x063a2e});const mesh=new THREE.Mesh(new THREE.BoxGeometry(2,h,2),mat);mesh.position.set(x,h/2,z);scene.add(mesh);const roof=label(symbol);roof.position.set(x,h+.65,z);scene.add(roof);objects.push({mesh,mat,roof,h});});
let dragging=false,px=0,angle=.68;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX});window.addEventListener('pointerup',()=>dragging=false);window.addEventListener('pointermove',e=>{if(dragging){angle+=(e.clientX-px)*.008;px=e.clientX;camera.position.x=Math.sin(angle)*21;camera.position.z=Math.cos(angle)*21;camera.lookAt(0,1.5,0)}});renderer.domElement.addEventListener('wheel',e=>{camera.position.multiplyScalar(e.deltaY>0?1.05:.95);camera.lookAt(0,1.5,0)},{passive:true});
function update(){const parent=document.getElementById('rows');parent.replaceChildren();tickers.forEach((s,i)=>{const move=(Math.random()-.5)*.012;prices[i]*=1+move;const up=move>=0;const o=objects[i];o.mat.color.set(up?0x20c997:0xff566f);o.mat.emissive.set(up?0x073c30:0x49131b);const h=Math.max(.9,o.h*(1+Math.abs(move)*13));o.mesh.scale.y=h/o.h;o.mesh.position.y=h/2;o.roof.position.y=h+.65;const row=document.createElement('div');row.className='item';const sym=document.createElement('span');sym.textContent=s;const num=document.createElement('span');num.textContent=`$${prices[i].toFixed(2)} ${up?'▲':'▼'}`;num.style.color=up?'#64e4af':'#ff8090';row.append(sym,num);parent.append(row)})}update();setInterval(()=>{if(!paused)update()},2000);document.getElementById('toggle').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume simulation':'Pause simulation'};
function draw(){requestAnimationFrame(draw);renderer.render(scene,camera)}draw();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
